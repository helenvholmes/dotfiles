# Starship prompt, plain-Unicode version of starship.toml for terminals that can't
# load a Nerd Font, such as the Claude app's terminal pane. Same layout and colors;
# icons swapped for ordinary symbols every Mac font has. ~/.zshrc picks this file
# when TERM_PROGRAM is claude-desktop. Keep it in step with starship.toml.
#
# Reads as:  ✿ dotfiles on ⎇ main [!] via ⬢ v22.23.5 took 3s
#            ♥

format = """${custom.flower}$directory$git_branch$git_status$nodejs$python$cmd_duration
$character"""

add_newline = true

palette = "pastel_dark"

# Fixed colors, unlike starship.toml: the Claude app's terminal has its own built-in
# named colors that nothing can change, so this file says exactly which shades to use.
# ~/.zshrc swaps in pastel_light when macOS is in light mode as the tab opens; a tab
# opened before a mode switch keeps its colors until `exec zsh -l`.
[palettes.pastel_dark]
pink = "#ED93B1"
lavender = "#AFA9EC"
gray = "#888780"
amber = "#EF9F27"
green = "#97C459"
coral = "#F09595"

# The iTerm Pastel profile's light-mode colors, except pink: the Claude terminal darkens
# any text color under about 4.5:1 contrast (so iTerm's soft #EF7EA4 turned mauve here).
# #D31A58 is the same hue, just dark enough to pass, so it's drawn exactly.
[palettes.pastel_light]
pink = "#D31A58"
lavender = "#534AB7"
gray = "#686673"
amber = "#854F0B"
green = "#3B6D11"
coral = "#A32D2D"

# The flower at the start of the line
[custom.flower]
command = "echo ✿"
when = true
format = "[$output]($style) "
style = "pink"

[directory]
style = "lavender"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "⎇ "
style = "pink"
format = "[on](gray) [$symbol$branch]($style) "

[git_status]
style = "amber"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[nodejs]
symbol = "⬢ "
style = "green"
format = "[via](gray) [$symbol$version]($style) "

[python]
symbol = "⌬ "
style = "amber"
format = "[via](gray) [$symbol$version( \\($virtualenv\\))]($style) "

[cmd_duration]
min_time = 2000
style = "gray"
format = "[took $duration]($style) "

[character]
success_symbol = "[♥](pink)"
error_symbol = "[♥](coral)"
vimcmd_symbol = "[♥](lavender)"
